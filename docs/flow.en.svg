<text x="30" y="560" font-size="11" fill="#5F5E5A">Each finding carries its evidence and the Google spam policy line it stands next to</text><path d="M30 742 H730" stroke="#D3D1C7" stroke-width="0.5" fill="none"/><text x="380" y="762" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Command line: python -m backlink_guard  find · vet · verify · audit · log</text><text x="380" y="779" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Agent Skill: npx skills add zhuyansen/backlink-guard</text>
