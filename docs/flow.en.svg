<text x="30" y="684" font-size="11" fill="#5F5E5A">Each finding carries its evidence and the Google spam policy line it stands next to</text><text x="30" y="700" font-size="11" fill="#5F5E5A">plus link policy and value columns · a check that failed: incomplete, run it again</text><path d="M30 898 H730" stroke="#D3D1C7" stroke-width="0.5" fill="none"/><text x="380" y="918" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Command line: python -m backlink_guard  find · vet · verify · audit · log · recheck</text><text x="380" y="935" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Agent Skill: npx skills add zhuyansen/backlink-guard</text>
