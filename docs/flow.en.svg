<text x="30" y="930" font-size="11" fill="#5F5E5A">Each finding carries its evidence and the Google spam policy line it stands next to</text><text x="30" y="946" font-size="11" fill="#5F5E5A">plus link policy and value columns · a check that failed: incomplete, run it again</text><path d="M30 1266 H730" stroke="#D3D1C7" stroke-width="0.5" fill="none"/><text x="380" y="1286" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Command line: backlink-guard  find · vet · verify · audit · lost · log · recheck</text><text x="380" y="1303" text-anchor="middle" font-size="11.5" fill="#5F5E5A">competitors · cited · questions · asked · an MCP server: backlink-guard mcp</text><text x="380" y="1320" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Claude Code plugin · Agent Skill: npx skills add zhuyansen/backlink-guard</text><text x="380" y="1337" text-anchor="middle" font-size="11.5" fill="#993C1D">orange text and the NEW tag: new in 0.11</text>
